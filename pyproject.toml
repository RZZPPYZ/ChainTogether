[project]
name = "chaintogether"
version = "0.1.0"
description = "Extracted multi-agent CLI, group, MCP delegation, slash command, and scheduling runtime from Octopus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "mcp>=1.0",
]

[project.scripts]
chaintogether = "server.cli:main"
octopus = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]
