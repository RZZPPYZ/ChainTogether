# Project-local agent prompt fragments.
# This file is loaded fresh on every backend turn.
#
# Supported sections:
# [common] applies to every agent in this working directory.
# [backends."claude-code"] applies to Claude Code backed sessions.
# [backends.codex] applies to Codex backed sessions.
# [agents."Agent Name"] applies to an exact agent name, or use the agent id.
# [group] applies only when the agent is running as a group member.
# Project-specific group additions can live in .chaintogether/rules.md. Core
# identity, @routing, handoff, HOLD and ping-pong policy lives in server/assets.

[common]
system_prompt = ""

[backends."claude-code"]
system_prompt = ""

[backends.codex]
system_prompt = ""

[group]
system_prompt = ""

# Example:
# [agents."Claude"]
# system_prompt = """
# Claude-specific project rules go here.
# """
#
# [agents."Codex"]
# system_prompt = """
# Codex-specific project rules go here.
# """
