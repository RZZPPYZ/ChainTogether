{
  "schema_version": 1,
  "source_root": ".chaintogether/skills",
  "provider_targets": {
    "claude": ".claude/skills",
    "codex": ".codex/skills"
  },
  "skills": {
    "feature-lifecycle": {
      "kind": "router",
      "stages": ["*"],
      "roles": ["coordinator"],
      "outputs": ["lifecycle-routing"]
    },
    "feature-discovery": {
      "kind": "stage",
      "stages": ["discovery"],
      "roles": ["discovery-lead", "researcher", "synthesizer"],
      "outputs": ["feature-doc", "discovery-evidence"]
    },
    "design-gate": {
      "kind": "gate",
      "stages": ["design"],
      "roles": ["design-reviewer", "operator"],
      "outputs": ["design-verdict"]
    },
    "writing-plans": {
      "kind": "stage",
      "stages": ["planning"],
      "roles": ["planner"],
      "outputs": ["implementation-plan"]
    },
    "worktree": {
      "kind": "execution",
      "stages": ["implementation"],
      "roles": ["author"],
      "outputs": ["worktree-record"]
    },
    "tdd": {
      "kind": "execution",
      "stages": ["implementation"],
      "roles": ["author"],
      "outputs": ["tests", "implementation"]
    },
    "quality-gate": {
      "kind": "gate",
      "stages": ["quality"],
      "roles": ["author", "quality-reviewer"],
      "outputs": ["quality-report"]
    },
    "request-review": {
      "kind": "handoff",
      "stages": ["review"],
      "roles": ["author"],
      "outputs": ["review-packet"]
    },
    "review-feature": {
      "kind": "gate",
      "stages": ["review"],
      "roles": ["reviewer"],
      "outputs": ["review-findings", "review-verdict"]
    },
    "receive-review": {
      "kind": "feedback",
      "stages": ["review"],
      "roles": ["author"],
      "outputs": ["finding-dispositions"]
    },
    "merge-gate": {
      "kind": "gate",
      "stages": ["merge"],
      "roles": ["merge-owner"],
      "outputs": ["merge-evidence-manifest"]
    },
    "vision-gate": {
      "kind": "gate",
      "stages": ["acceptance"],
      "roles": ["vision-guardian"],
      "outputs": ["vision-verdict"]
    },
    "close-feature": {
      "kind": "gate",
      "stages": ["closure"],
      "roles": ["coordinator"],
      "outputs": ["closed-feature-doc"]
    }
  }
}
